<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit map marker</title>
    <style>
      #name { flex: 0 0 auto; height: 58px; font: 13px/1.35 system-ui, sans-serif; }
      .seg { display: flex; }
      .seg button {
        flex: 1; padding: 4px 0; color: #b3c0c6; background: rgba(7, 8, 12, .75);
        border: 1px solid #3a434b; font: 12px system-ui, sans-serif; cursor: pointer;
      }
      .seg button + button { border-left: none; }
      .seg button[aria-pressed="true"] { color: #07080c; background: #f5e10a; border-color: #f5e10a; }
      input[type="color"] { box-sizing: border-box; width: 100%; height: 28px; padding: 0 2px; background: none; border: 1px solid #3a434b; }
      .pair { display: flex; gap: 4px; }
      .pair button { padding: 0 8px; color: #b3c0c6; background: rgba(7, 8, 12, .75); border: 1px solid #3a434b; font: 12px system-ui, sans-serif; cursor: pointer; }
      .row label.check { flex: 1 1 140px; align-self: flex-end; padding-bottom: 5px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <form id="editor">
      <div class="row" id="modeRow">
        <label>Pin
          <span class="seg" id="mode">
            <button type="button" data-mode="linked">Crew sheet</button>
            <button type="button" data-mode="custom">Custom</button>
          </span>
        </label>
      </div>
      <div class="row" id="linkRow">
        <label>Sheet (name, initials and colour follow it)<select id="sheet"></select></label>
      </div>
      <label id="nameBox">Name <span id="nameHint">(Enter = new line)</span><textarea id="name" autocomplete="off"></textarea></label>
      <div class="row" id="placeRow">
        <label>Kind
          <select id="kind">
            <option value="place">Place</option><option value="contact">Contact</option><option value="corp">Corp</option>
            <option value="danger">Danger</option><option value="home">Home</option>
          </select>
        </label>
        <label>Lines
          <span class="seg" id="align">
            <button type="button" data-align="left">Left</button>
            <button type="button" data-align="center">Centre</button>
            <button type="button" data-align="right">Right</button>
          </span>
        </label>
      </div>
      <div class="row" id="placeRow2">
        <label>Colour<span class="pair"><input id="placeColor" type="color" /><button type="button" id="kindColor" title="Use the kind's colour">Kind</button></span></label>
        <label class="check"><input id="broken" type="checkbox" /> Broken (dimmed, struck through)</label>
      </div>
      <div class="row" id="pinRow">
        <label>Initials<input id="short" type="text" maxlength="3" autocomplete="off" /></label>
        <label>Colour<input id="color" type="color" /></label>
      </div>
    </form>
    <script type="module" src="/src/map/editor.ts"></script>
  </body>
</html>
