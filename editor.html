<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit window</title>
  </head>
  <body>
    <form id="editor">
      <label>Title<input id="title" type="text" autocomplete="off" /></label>
      <div class="row">
        <label>Type tag<input id="tag" type="text" autocomplete="off" placeholder="Org, Person, Main Gig …" /></label>
        <label>Variant
          <select id="variant"><option value="standard">Standard</option><option value="brief">Brief</option></select>
        </label>
      </div>
      <div id="todayRow" class="row" hidden>
        <label>Current date
          <span class="today"><button type="button" id="todayMinus">−1</button><input id="today" type="text" autocomplete="off" placeholder="19.05.2077" /><button type="button" id="todayPlus">+1</button></span>
        </label>
      </div>
      <div id="tools" class="tools"></div>
      <label class="grow"><span id="textLabel">Text (Markdown)</span><textarea id="markdown" spellcheck="false"></textarea></label>
      <details id="helpBox"><summary>Format</summary><pre id="help"></pre></details>
    </form>
    <script type="module" src="/src/windows/editor.ts"></script>
  </body>
</html>
